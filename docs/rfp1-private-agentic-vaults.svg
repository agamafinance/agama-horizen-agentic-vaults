<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffffff"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fd9b8"/>
    </marker>
  </defs>

  <rect width="1440" height="810" fill="#254839"/>
  <rect width="1440" height="810" fill="url(#grid)"/>
  <rect x="16" y="16" width="1408" height="778" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- title -->
  <text x="40" y="66" fill="#ffffff" font-size="30" font-weight="700">Private agentic vaults on Horizen</text>
  <!-- legend -->
  <g font-size="13" fill="#c2d6cb">
    <rect x="930" y="46" width="26" height="16" rx="4" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
    <text x="964" y="59">Agama</text>
    <rect x="1030" y="46" width="26" height="16" rx="4" fill="#2e4a3c" stroke="#9fd9b8" stroke-width="1.5"/>
    <text x="1064" y="59">Horizen ecosystem</text>
    <rect x="1200" y="46" width="26" height="16" rx="4" fill="none" stroke="#c2d6cb" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1234" y="59">later / when live</text>
  </g>

  <!-- tier bands -->
  <rect x="40" y="100" width="1070" height="200" rx="16" fill="#ffffff" fill-opacity="0.025" stroke="#6e8c7d" stroke-opacity="0.5"/>
  <text x="58" y="124" fill="#9fd9b8" font-size="12" font-weight="700" letter-spacing="1.5">OFF-CHAIN</text>
  <rect x="40" y="320" width="1070" height="290" rx="16" fill="#ffffff" fill-opacity="0.025" stroke="#9fd9b8" stroke-opacity="0.6"/>
  <text x="58" y="344" fill="#9fd9b8" font-size="12" font-weight="700" letter-spacing="1.5">HORIZEN L3 · ON-CHAIN</text>
  <rect x="1140" y="100" width="270" height="510" rx="16" fill="#ffffff" fill-opacity="0.025" stroke="#6e8c7d" stroke-opacity="0.5"/>
  <text x="1158" y="124" fill="#9fd9b8" font-size="12" font-weight="700" letter-spacing="1.5">MARKET &amp; OUTPUT</text>

  <!-- Strategists -->
  <rect x="60" y="140" width="270" height="145" rx="14" fill="#2e4a3c" stroke="#c2d6cb" stroke-width="1.5"/>
  <text x="80" y="170" fill="#ffffff" font-size="19" font-weight="700">Strategists</text>
  <g font-size="13" fill="#ffffff">
    <rect x="80" y="186" width="72" height="30" rx="8" fill="#37574a" stroke="#6e8c7d"/><text x="116" y="206" text-anchor="middle">AI agent</text>
    <rect x="160" y="186" width="80" height="30" rx="8" fill="#37574a" stroke="#6e8c7d"/><text x="200" y="206" text-anchor="middle">Quant model</text>
    <rect x="248" y="186" width="66" height="30" rx="8" fill="#37574a" stroke="#6e8c7d"/><text x="281" y="206" text-anchor="middle">Rules bot</text>
  </g>
  <text x="80" y="244" fill="#c2d6cb" font-size="13">Run their own model.</text>
  <text x="80" y="263" fill="#9fd9b8" font-size="13" font-weight="700">Strategy logic never leaves here.</text>

  <!-- Netting engine -->
  <rect x="470" y="150" width="300" height="120" rx="14" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="490" y="180" fill="#ffffff" font-size="19" font-weight="700">Netting engine</text>
  <text x="490" y="204" fill="#c2d6cb" font-size="13">Decrypts the batch, crosses opposite</text>
  <text x="490" y="222" fill="#c2d6cb" font-size="13">orders, allocates fills per strategy</text>
  <text x="490" y="252" fill="#9fd9b8" font-size="12">v1 operator  ·  v2 inside a Vela enclave</text>

  <!-- Prover -->
  <rect x="890" y="150" width="200" height="120" rx="14" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="910" y="180" fill="#ffffff" font-size="19" font-weight="700">Prover</text>
  <text x="910" y="204" fill="#c2d6cb" font-size="13">Noir · UltraHonk</text>
  <text x="910" y="222" fill="#c2d6cb" font-size="13">settle proof per cycle</text>
  <text x="910" y="252" fill="#9fd9b8" font-size="12">books · mandates · NAV</text>

  <!-- OrderBox -->
  <rect x="60" y="365" width="270" height="95" rx="14" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="80" y="395" fill="#ffffff" font-size="19" font-weight="700">OrderBox</text>
  <text x="80" y="419" fill="#c2d6cb" font-size="13">Encrypted orders, hash committed</text>
  <text x="80" y="437" fill="#c2d6cb" font-size="13">before the closing price is set</text>

  <!-- ClearingPool -->
  <rect x="470" y="365" width="300" height="95" rx="14" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="490" y="395" fill="#ffffff" font-size="19" font-weight="700">ClearingPool</text>
  <text x="490" y="419" fill="#c2d6cb" font-size="13">Shared custody of every strategy.</text>
  <text x="490" y="437" fill="#c2d6cb" font-size="13">Only the total is visible.</text>

  <!-- EpochSettler -->
  <rect x="890" y="365" width="200" height="95" rx="14" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="910" y="395" fill="#ffffff" font-size="19" font-weight="700">EpochSettler</text>
  <text x="910" y="419" fill="#c2d6cb" font-size="13">Verifies the proof,</text>
  <text x="910" y="437" fill="#c2d6cb" font-size="13">enforces guards</text>
  

  <!-- Depositors -->
  <rect x="60" y="500" width="270" height="90" rx="14" fill="#2e4a3c" stroke="#c2d6cb" stroke-width="1.5"/>
  <text x="80" y="530" fill="#ffffff" font-size="19" font-weight="700">Depositors</text>
  <text x="80" y="554" fill="#c2d6cb" font-size="13">Pick a strategy on its proven</text>
  <text x="80" y="572" fill="#c2d6cb" font-size="13">track record, not its positions</text>

  <!-- Strategy vaults -->
  <rect x="470" y="500" width="300" height="90" rx="14" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="490" y="530" fill="#ffffff" font-size="19" font-weight="700">Strategy vaults</text>
  <text x="490" y="554" fill="#c2d6cb" font-size="13">One ERC-4626 per strategy,</text>
  <text x="490" y="572" fill="#c2d6cb" font-size="13">caution in ZEN, ranked</text>

  <!-- Private books -->
  <rect x="890" y="500" width="200" height="90" rx="14" fill="#2e4a3c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="910" y="530" fill="#ffffff" font-size="19" font-weight="700">Private books</text>
  <text x="910" y="554" fill="#c2d6cb" font-size="13">One commitment</text>
  <text x="910" y="572" fill="#c2d6cb" font-size="13">per strategy</text>

  <!-- Market column -->
  <rect x="1160" y="150" width="230" height="100" rx="14" fill="#2e4a3c" stroke="#9fd9b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1180" y="180" fill="#ffffff" font-size="19" font-weight="700">ZENDEX</text>
  <text x="1180" y="204" fill="#c2d6cb" font-size="13">Private venue on Horizen,</text>
  <text x="1180" y="222" fill="#c2d6cb" font-size="13">hides who trades</text>
  <text x="1180" y="240" fill="#9fd9b8" font-size="12">when live</text>

  <rect x="1160" y="280" width="230" height="95" rx="14" fill="#2e4a3c" stroke="#9fd9b8" stroke-width="1.5"/>
  <text x="1180" y="310" fill="#ffffff" font-size="19" font-weight="700">Base liquidity</text>
  <text x="1180" y="334" fill="#c2d6cb" font-size="13">Real depth today,</text>
  <text x="1180" y="352" fill="#c2d6cb" font-size="13">reached through a bridge</text>

  <rect x="1160" y="470" width="230" height="120" rx="14" fill="#37574a" stroke="#9fd9b8" stroke-width="1.5"/>
  <text x="1180" y="500" fill="#ffffff" font-size="19" font-weight="700">Public track record</text>
  <text x="1180" y="524" fill="#c2d6cb" font-size="13">NAV per share · drawdown</text>
  <text x="1180" y="542" fill="#c2d6cb" font-size="13">mandate respected</text>
  <text x="1180" y="570" fill="#9fd9b8" font-size="12">proven, never declared</text>

  <!-- arrows -->
  <g stroke="#ffffff" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M300 285 V360"/>
    <path d="M330 395 C 400 395, 420 240, 465 230"/>
    <path d="M620 150 V 134 H 1125 V 200 H 1155"/>
    <path d="M1125 200 V 327 H 1155"/>
    <path d="M770 210 H 885"/>
    <path d="M990 270 V360"/>
    <path d="M990 460 V495"/>
    <path d="M1090 415 C 1130 415, 1130 520, 1155 525"/>
    <path d="M330 545 H 465"/>
    <path d="M620 500 V465"/>
    <path d="M1160 355 H 1112 V 306 H 700 V 360" stroke="#9fd9b8" marker-end="url(#am)"/>
  </g>

  <!-- arrow labels -->
  <g font-size="12.5" fill="#ffffff">
    <text x="292" y="318" text-anchor="end">① encrypted orders</text>
    <text x="352" y="296">② batch</text>
    <text x="800" y="128">③ one net order only</text>
    <text x="785" y="203" fill="#c2d6cb">witness</text>
    <text x="980" y="348" text-anchor="end">④ ZK proof, via zkVerify</text>
    <text x="1000" y="483" fill="#c2d6cb">new commitments</text>
    <text x="1094" y="405" font-size="11.5">⑤ publish</text>
    <text x="352" y="537" fill="#c2d6cb">deposit</text>
    <text x="630" y="486" fill="#c2d6cb">assets</text>
    <text x="712" y="298" fill="#9fd9b8">fills back to the pool</text>
  </g>

  <!-- who sees what -->
  <rect x="40" y="635" width="1370" height="140" rx="16" fill="#2e4a3c" stroke="#6e8c7d"/>
  <text x="64" y="668" fill="#ffffff" font-size="17" font-weight="700">Who sees what</text>
  <g font-size="14">
    <text x="64" y="700" fill="#9fd9b8" font-weight="700">PUBLIC</text>
    <text x="150" y="700" fill="#ffffff">the net order sent to market  ·  the pool total  ·  each strategy's NAV, drawdown and mandate check</text>
    <text x="64" y="730" fill="#9fd9b8" font-weight="700">PRIVATE</text>
    <text x="150" y="730" fill="#ffffff">strategy logic  ·  each strategy's orders  ·  each strategy's positions  ·  which strategy traded what</text>
    <text x="64" y="758" fill="#c2d6cb" font-size="13">v1: the netting operator sees orders, correctness is proven in ZK.  v2: netting moves into a Vela enclave, so no one sees them.</text>
  </g>
</svg>
