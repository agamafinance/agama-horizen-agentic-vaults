name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  noir:
    name: nargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Noir
        uses: noir-lang/noirup@v0.1.3
        with:
          toolchain: 1.0.0-beta.13
      - name: Settlement circuit tests
        working-directory: zk/strategy_epoch
        run: nargo test
      - name: Netting circuit tests
        working-directory: zk/net_epoch
        run: nargo test
      - name: Vault circuit tests
        working-directory: zk/vault_epoch
        run: nargo test

  forge:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.1
      - name: Contract tests against real proofs
        working-directory: contracts
        run: forge test -vv --summary

  python:
    name: netting tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Netting across strategies
        run: python3 -m unittest discover -s agents -p 'test_*.py' -v

  zendex:
    name: execution window tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Netting window to ZENDEX legs
        run: node --test execution/zendex/aggregate.test.mjs
